<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LeadGuard AI — dossier de présentation</title>
<style>
/* Design tokens — mesure de la marque : ce sont ceux de la console LeadGuard
   (app/static/css/tokens.css), pas une palette inventée pour le deck. */

:root {
  --navy: #0f172a;
  --navy-soft: #16213c;
  --ink: #1e293b;
  --muted: #64748b;
  --blue: #2563eb;
  --blue-soft: #e8efff;
  --indigo: #4f46e5;
  --cyan: #0891b2;
  --violet: #7c3aed;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --amber: #d97706;
  --amber-soft: #fef3c7;
  --red: #dc2626;
  --line: #e2e8f0;
  --surface: #f6f8fc;
  --paper: #ffffff;
  --hud: 74px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #0b1120;
  color: var(--ink);
  font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------------------------------------------------------------- la scène */

.app {
  height: 100%;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.stage {
  position: relative;
  container-type: size;
  aspect-ratio: 16 / 9;
  width: min(100vw, calc((100vh - 0px) * 16 / 9));
  height: min(calc(100vw * 9 / 16), 100vh);
  background: var(--paper);
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(2, 6, 23, .55);
}

.slide {
  position: absolute;
  inset: 0;
  padding: 6cqh 5.6cqw calc(var(--hud) + 4cqh);
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: var(--paper);
}

.slide[hidden] { display: none; }

/* ------------------------------------------------------------- typographie */

.kicker {
  font-size: clamp(11px, 1.05cqw, 16px);
  letter-spacing: .16em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--blue);
  margin: 0 0 1.6cqh;
}

h1 {
  font-size: clamp(34px, 4.6cqw, 68px);
  line-height: 1.04;
  letter-spacing: -.02em;
  color: var(--navy);
  margin: 0 0 1.8cqh;
}

h2 {
  font-size: clamp(26px, 3cqw, 46px);
  line-height: 1.12;
  letter-spacing: -.015em;
  color: var(--navy);
  margin: 0 0 2.2cqh;
  max-width: 32ch;
}

p {
  font-size: clamp(14px, 1.35cqw, 20px);
  line-height: 1.55;
  color: var(--muted);
  margin: 0 0 1.4cqh;
  max-width: 64ch;
}

.lead { font-size: clamp(16px, 1.6cqw, 24px); color: var(--ink); }
.small { font-size: clamp(12px, 1.12cqw, 16px); }
.tiny { font-size: clamp(11px, .95cqw, 13px); color: var(--muted); }
.mono { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: .92em; }

ul { margin: 0; padding-left: 2.2cqw; }
li { font-size: clamp(13px, 1.25cqw, 18px); line-height: 1.5; color: var(--ink); margin-bottom: .8cqh; }
li::marker { color: var(--blue); }

strong { color: var(--navy); }

/* ---------------------------------------------------------------- blocs */

.row { display: flex; gap: 2cqw; align-items: flex-start; }
.col { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.8cqw; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5cqw; align-items: start; }

.card {
  border: 1px solid var(--line);
  border-radius: 1.1cqw;
  padding: 2cqh 1.6cqw;
  background: var(--paper);
}
.card.soft { background: var(--surface); border-color: #dbe4f3; }
.card h3 {
  font-size: clamp(13px, 1.3cqw, 19px);
  margin: 0 0 .8cqh;
  color: var(--navy);
}
.card p, .card li { font-size: clamp(12px, 1.1cqw, 15.5px); }

.pill {
  display: inline-block;
  padding: .25cqh .8cqw;
  border-radius: 999px;
  font-size: clamp(10px, .95cqw, 13px);
  font-weight: 650;
  white-space: nowrap;
}
.pill.ok { background: var(--green-soft); color: #15803d; }
.pill.warn { background: var(--amber-soft); color: #b45309; }
.pill.info { background: #dbeafe; color: #1d4ed8; }
.pill.mock { background: #ede9fe; color: #6d28d9; }
.pill.off { background: #fee2e2; color: #b91c1c; }

.quote {
  border-left: .35cqw solid var(--blue);
  padding: .6cqh 0 .6cqh 1.4cqw;
  font-size: clamp(15px, 1.5cqw, 23px);
  color: var(--navy);
  line-height: 1.45;
  margin: 0;
  max-width: 58ch;
}

table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  font-size: clamp(10px, .95cqw, 13px);
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  padding: .9cqh .8cqw;
  border-bottom: 1px solid var(--line);
  font-weight: 700;
}
td {
  padding: 1.1cqh .8cqw;
  border-bottom: 1px solid #eef2f8;
  font-size: clamp(12px, 1.1cqw, 16px);
  vertical-align: top;
  color: var(--ink);
}
td:first-child { white-space: nowrap; }

.kpi { display: flex; gap: 1.2cqw; }
.kpi > div {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 1cqw;
  padding: 1.4cqh 1.2cqw;
}
.kpi b {
  display: block;
  font-size: clamp(22px, 2.6cqw, 40px);
  color: var(--navy);
  letter-spacing: -.02em;
  line-height: 1.05;
}
.kpi span { font-size: clamp(11px, 1cqw, 14px); color: var(--muted); }

.flow { display: flex; align-items: stretch; gap: .8cqw; }
.step {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: .9cqw;
  padding: 1.2cqh .9cqw;
  background: var(--surface);
}
.step b { display: block; font-size: clamp(12px, 1.15cqw, 16px); color: var(--navy); margin-bottom: .5cqh; }
.step span { font-size: clamp(10px, .95cqw, 13px); color: var(--muted); line-height: 1.35; display: block; }
.step.hot { border-color: #bfdbfe; background: #f8fbff; }
.arrow { align-self: center; color: #94a3b8; font-size: clamp(12px, 1.1cqw, 16px); }

.shot { border: 1px solid var(--line); border-radius: .9cqw; overflow: hidden; }
.shot img { display: block; width: 100%; }

.title-slide {
  background: linear-gradient(135deg, #0f172a 0%, var(--navy-soft) 55%, #1b2a54 100%);
  justify-content: center;
}
.title-slide h1 { color: #fff; font-size: clamp(38px, 5.4cqw, 78px); }
.title-slide p { color: #c7d2e5; }
.title-slide .kicker { color: #7dd3fc; }
.title-slide .tiny { color: #94a3b8; }

.brand { display: flex; align-items: center; gap: 1cqw; margin-bottom: 3cqh; }
.mark {
  width: clamp(32px, 3cqw, 48px);
  height: clamp(32px, 3cqw, 48px);
  border-radius: .8cqw;
  background: var(--blue);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: clamp(12px, 1.2cqw, 17px);
}
.brand-name { font-size: clamp(11px, 1.05cqw, 15px); letter-spacing: .05em; color: #c7d2e5; }

/* ------------------------------------------------------------------- HUD */

.hud {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: var(--hud);
  display: flex;
  align-items: center;
  gap: 1.4cqw;
  padding: 0 2.4cqw;
  border-top: 1px solid var(--line);
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(6px);
  font-size: clamp(10px, .95cqw, 13px);
  color: var(--muted);
  z-index: 5;
}
.hud .section { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--blue); }
.hud .progress { flex: 1; height: 4px; background: #e8edf6; border-radius: 999px; overflow: hidden; }
.hud .progress i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .25s ease; }
.hud .counter { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 650; }
.hud button {
  font: inherit;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: .5cqw;
  padding: .5cqh .9cqw;
  cursor: pointer;
}
.hud button:hover { border-color: #bfdbfe; background: #f8fbff; }
.hud button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* ---------------------------------------------------------------- modes */

body.speaker .app {
  display: flex;
  align-items: stretch;
  gap: 18px;
  padding: 18px;
  height: 100vh;
}
body.speaker .stage {
  flex: 1.6;
  width: auto;
  height: auto;
  max-height: 100%;
}
body.speaker .notes-panel { flex: 1; max-width: 460px; }

.notes-panel {
  background: #fff;
  border-radius: 12px;
  padding: 18px 20px;
  overflow: auto;
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink);
}
.notes-panel h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--blue); }
.notes-panel p { font-size: 14px; color: var(--ink); max-width: none; }
.notes-panel .key { border-left: 3px solid var(--violet); padding-left: 12px; font-weight: 600; }
.notes-panel ul { padding-left: 18px; }
.notes-panel li { font-size: 13.5px; }

.timer {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: #0f172a;
  color: #fff;
  border-radius: 999px;
  padding: 8px 18px;
  font-variant-numeric: tabular-nums;
  font-size: 15px;
  font-weight: 600;
  z-index: 20;
}
.timer.warn { background: #b45309; }
.timer.over { background: #b91c1c; }

/* ------------------------------------------------------------------ print */

body.print {
  background: #fff;
  overflow: visible;
}
body.print .app { display: block; height: auto; }
body.print .stage { display: none; }
body.print .print-stack { display: block; }

.print-slide {
  position: relative;
  width: 1280px;
  height: 720px;
  margin: 0 auto;
  page-break-after: always;
  break-after: page;
  background: #fff;
  overflow: hidden;
}
.print-slide:last-child { page-break-after: auto; }

@page { size: 1280px 720px; margin: 0; }

@media print {
  html, body { background: #fff; }
  .hud, .timer, .notes-panel { display: none !important; }
  .print-slide { box-shadow: none; }
}

</style>
</head>
<body>
<main class="app">
  <section class="stage" id="stage" aria-live="polite">
    <div class="hud" id="hud">
      <span class="section">Ouverture</span>
      <span class="counter">1 / 14</span>
      <span class="progress"><i style="width:0"></i></span>
      <button type="button" data-prev aria-label="Slide précédente">←</button>
      <button type="button" data-next aria-label="Slide suivante">→</button>
      <button type="button" onclick="location.hash='#/speaker/1'" title="Mode présentateur (s)">Présentateur</button>
      <button type="button" onclick="location.hash='#/print'" title="Mode impression (p)">PDF</button>
    </div>
  </section>
  <section class="print-stack" id="print" hidden></section>
  <section class="notes-doc" id="notes-doc" hidden style="position:fixed;inset:0;overflow:auto;background:#0b1120;padding:32px 40px"></section>
</main>
<script type="module">
// ---- données (slides.js) ----

 * Contenu des slides. Un fichier pour tout ce qui se lit : durées, sections,

 *
 * Règle de rédaction : une idée par slide, des verbes précis, et pour chaque
 * brique d'architecture ce qu'elle fait *et* ce qu'elle ne fait jamais.
 */

const node = (title, detail, hot = false) =>
  `<div class="step${hot ? " hot" : ""}"><b>${title}</b><span>${detail}</span></div>`;

const arrow = '<div class="arrow">→</div>';

const card = (title, body, soft = true) =>
  `<div class="card${soft ? " soft" : ""}"><h3>${title}</h3><p class="small" style="margin:0">${body}</p></div>`;

const pill = (label, tone) => `<span class="pill ${tone}">${label}</span>`;

const SLIDES = [

// ---- moteur (deck.js) ----

/**
 * Moteur du deck : un seul conteneur, un routeur par hash, cinq modes.
 *
 *   #/s/3          présentation, slide 3
 *   #/speaker/3    présentateur (slide + script privé)
 *   #/rehearsal    chronomètre total + repères
 *   #/print        toutes les slides empilées, une par page
 *   #/notes        le script en document lisible
 *   ?mode=print    même chose au chargement : c'est ce que Chrome imprime en PDF
 *
 * Aucune dépendance : modules ES natifs, servis par l'application.
 */



const stage = document.getElementById("stage");
const hud = document.getElementById("hud");
const printStack = document.getElementById("print");
const notesDoc = document.getElementById("notes-doc");

const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

/** Rendu d'une slide dans un conteneur donné. */
function renderSlide(slide, index, container) {
  const section = document.createElement("section");
  // La variante sombre (ouverture, clôture) vient des données, pas du moteur.
  section.className = slide.tone === "dark" ? "slide title-slide" : "slide";
  section.dataset.id = slide.id;
  section.setAttribute("aria-label", `${index + 1}. ${slide.title}`);
  section.innerHTML = slide.html();
  container.append(section);
  return section;
}

const slides = SLIDES.map((slide, index) => renderSlide(slide, index, stage));

/** HUD : section, compteur, progression et navigation. */
function paintHud(index) {
  const slide = SLIDES[index];
  hud.querySelector(".section").textContent = slide.section;
  hud.querySelector(".counter").textContent = `${index + 1} / ${SLIDES.length}`;
  hud.querySelector(".progress i").style.width = `${((index + 1) / SLIDES.length) * 100}%`;
  hud.querySelector("[data-prev]").disabled = index === 0;
  hud.querySelector("[data-next]").disabled = index === SLIDES.length - 1;
  document.title = `${slide.title} · LeadGuard AI`;
}

function show(index, { animate = true } = {}) {
  const target = clamp(index, 0, SLIDES.length - 1);
  slides.forEach((section, position) => {
    section.hidden = position !== target;
  });
  const current = slides[target];
  if (animate) {
    current.animate(
      [
        { opacity: 0, transform: "translateY(14px)" },
        { opacity: 1, transform: "translateY(0)" },
      ],
      { duration: 260, easing: "cubic-bezier(.22,.61,.36,1)" },
    );
  }
  paintHud(target);
  return target;
}

// --------------------------------------------------------------------- modes

let mode = "presentation";
let index = 0;

function setMode(nextMode, nextIndex = index) {
  mode = nextMode;
  document.body.classList.toggle("speaker", mode === "speaker");
  document.body.classList.toggle("print", mode === "print");
  notesDoc.hidden = mode !== "notes";
  printStack.hidden = mode !== "print";
  stage.hidden = mode === "print" || mode === "notes";
  hud.hidden = mode === "print" || mode === "notes";
  if (mode === "print") renderPrint();
  if (mode === "notes") renderNotes();
  if (mode === "speaker") renderNotesPanel(nextIndex);
  index = show(nextIndex, { animate: mode === "presentation" });
  if (mode !== "rehearsal") stopTimer();
  if (mode === "rehearsal") startTimer();
}

function renderPrint() {
  if (printStack.dataset.ready === "1") return;
  SLIDES.forEach((slide, position) => {
    const section = document.createElement("section");
    section.className = "print-slide";
    const tone = slide.tone === "dark" ? " title-slide" : "";
    section.innerHTML = `<div class="slide${tone}" style="position:absolute;inset:0;padding:48px 56px">${slide.html()}</div>`;
    printStack.append(section);
  });
  printStack.dataset.ready = "1";
}

function renderNotes() {
  if (notesDoc.dataset.ready === "1") return;
  notesDoc.innerHTML = [
    `<h1 style="color:#fff;margin:0 0 6px">Script · LeadGuard AI</h1>`,
    `<p style="color:#94a3b8;margin:0 0 26px">${SLIDES.length} slides · ${format(TOTAL_SECONDS)} au total</p>`,
    ...SLIDES.map((slide, position) => {
      const note = NOTES[slide.id] || {};
      return `
        <article style="background:#fff;color:#1e293b;border-radius:12px;padding:18px 22px;margin-bottom:14px">
          <h2 style="font-size:16px;margin:0 0 4px;color:#0f172a">
            ${position + 1}. ${slide.title}
            <span style="font-weight:500;color:#64748b;font-size:13px"> — ${slide.section} · ${format(slide.seconds)}</span>
          </h2>
          <p style="margin:6px 0;font-size:14px"><strong>Montrer :</strong> ${(note.show || []).join(" · ") || "—"}</p>
          <p style="margin:6px 0;font-size:14px">${note.speech || ""}</p>
          <p style="margin:6px 0;font-size:13.5px;border-left:3px solid #7c3aed;padding-left:10px"><strong>À retenir :</strong> ${note.key || "—"}</p>
          <p style="margin:6px 0;font-size:13px;color:#b45309"><strong>Éviter :</strong> ${(note.avoid || []).join(" · ") || "—"}</p>
        </article>`;
    }),
  ].join("");
  notesDoc.dataset.ready = "1";
}

// ---------------------------------------------------------------- présentateur

let panel;

function renderNotesPanel(position) {
  if (!panel) {
    panel = document.createElement("aside");
    panel.className = "notes-panel";
    document.querySelector(".app").append(panel);
  }
  const slide = SLIDES[position];
  const note = NOTES[slide.id] || {};
  panel.innerHTML = `
    <h3>${position + 1}. ${slide.title}</h3>
    <p><strong>Montrer :</strong> ${(note.show || []).join(" · ") || "—"}</p>
    <p>${note.speech || ""}</p>
    <p class="key">À retenir : ${note.key || "—"}</p>
    <p style="color:#b45309"><strong>Éviter :</strong> ${(note.avoid || []).join(" · ") || "—"}</p>
    <p class="tiny">Suivant : ${note.next || "fin"} · ${format(slide.seconds)} prévues</p>`;
}

// ----------------------------------------------------------------- chronomètre

let timerId = null;
let startedAt = 0;

function format(seconds) {
  const value = Math.max(0, Math.round(seconds));
  return `${Math.floor(value / 60)}:${String(value % 60).padStart(2, "0")}`;
}

function startTimer() {
  stopTimer();
  startedAt = performance.now();
  const badge = document.createElement("div");
  badge.className = "timer";
  badge.id = "timer";
  document.body.append(badge);
  timerId = setInterval(() => {
    const elapsed = (performance.now() - startedAt) / 1000;
    const remaining = TOTAL_SECONDS - elapsed;
    const cue = CUE_TIMES.filter((cueTime) => cueTime <= elapsed).length;
    badge.textContent = `${format(elapsed)} écoulées · ${format(remaining)} restantes · slide ${clamp(cue + 1, 1, SLIDES.length)}/${SLIDES.length}`;
    badge.className = "timer" + (remaining < 0 ? " over" : remaining < 60 ? " warn" : "");
  }, 250);
}

function stopTimer() {
  if (timerId) clearInterval(timerId);
  timerId = null;
  document.getElementById("timer")?.remove();
}

// -------------------------------------------------------------------- routeur

function route() {
  const query = new URLSearchParams(location.search);
  if (query.get("mode") === "print") {
    setMode("print", 0);
    return;
  }
  const [, kind, value] = location.hash.replace(/^#\/?/, "/").split("/");
  const position = Number.parseInt(value || "0", 10);
  switch (kind) {
    case "speaker":
      setMode("speaker", Number.isFinite(position) ? position - 1 : index);
      break;
    case "rehearsal":
      setMode("rehearsal", 0);
      break;
    case "print":
      setMode("print", 0);
      break;
    case "notes":
      setMode("notes", 0);
      break;
    case "s":
      setMode("presentation", Number.isFinite(position) ? position - 1 : index);
      break;
    default:
      setMode("presentation", 0);
  }
}

function go(delta) {
  const target = clamp(index + delta, 0, SLIDES.length - 1);
  if (target === index) return;
  if (mode === "print" || mode === "notes") setMode("presentation", target);
  else {
    index = show(target);
    if (mode === "speaker") renderNotesPanel(index);
  }
  history.replaceState(null, "", `#/s/${index + 1}`);
}

// ------------------------------------------------------------------ entrées

document.addEventListener("keydown", (event) => {
  const keys = ["ArrowRight", "ArrowLeft", " ", "PageDown", "PageUp", "Home", "End"];
  if (keys.includes(event.key)) event.preventDefault();
  switch (event.key) {
    case "ArrowRight":
    case "PageDown":
    case " ":
      go(1);
      break;
    case "ArrowLeft":
    case "PageUp":
    case "Backspace":
      go(-1);
      break;
    case "Home":
      setMode(mode === "speaker" ? "speaker" : "presentation", 0);
      break;
    case "End":
      setMode(mode === "speaker" ? "speaker" : "presentation", SLIDES.length - 1);
      break;
    case "f":
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
      break;
    case "s":
      location.hash = `#/speaker/${index + 1}`;
      break;
    case "r":
      location.hash = "#/rehearsal";
      break;
    case "p":
      location.hash = "#/print";
      break;
    case "n":
      location.hash = "#/notes";
      break;
    case "Escape":
      if (location.hash) location.hash = "";
      break;
    case "?":
      alert(
        "Flèches / espace : naviguer\nHome / Fin : début, fin\nf : plein écran\ns : mode présentateur\nr : répétition chronométrée\np : mode impression (PDF)\nn : script complet",
      );
      break;
    default:
      break;
  }
});

hud.querySelector("[data-prev]").addEventListener("click", () => go(-1));
hud.querySelector("[data-next]").addEventListener("click", () => go(1));
window.addEventListener("hashchange", route);

route();

</script>
</body>
</html>
